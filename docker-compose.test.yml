# Disposable Postgres for the test suites.
#
# A fresh database per run makes an entire bug class structurally impossible:
# the shared plan_limits corruption that a crashed run used to launder into the
# next run has nothing to launder into. It also removes the remote pooler
# latency that made the staff import race flaky.
#
# 17 to match Supabase (17.6). btree_gist is enabled up front because booking's
# double-booking guard needs EXCLUDE USING gist over a text staff id.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jelita
      POSTGRES_PASSWORD: jelita
      POSTGRES_DB: jelita_test
    ports:
      - '55432:5432'
    # tmpfs: the data never needs to outlive the run, and RAM-backed storage
    # takes a meaningful bite out of migration time.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jelita -d jelita_test']
      interval: 1s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for salon branding (PRD §7's white-label
  # line). MinIO speaks the same protocol as S3, so dev, the test suite and
  # production differ by endpoint and credentials -- not by code path.
  #
  # Same disposability rule as the database: no volume, so a run starts with an
  # empty bucket and nothing a crashed run left behind can leak into the next.
  s3:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: jelita
      MINIO_ROOT_PASSWORD: jelitajelita
    ports:
      - '59000:9000'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 1s
      timeout: 3s
      retries: 30

  # One-shot: create the bucket and exit. The app deliberately does NOT create
  # its own bucket -- in production that would need permissions no application
  # should hold, and a typo in the bucket name would silently succeed instead
  # of failing loudly on the first upload.
  s3-init:
    image: minio/mc:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 jelita jelitajelita &&
      mc mb --ignore-existing local/jelita-assets &&
      echo bucket ready
      "
